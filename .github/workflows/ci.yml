name: CI

on:
  push:
    branches: [main]
  # No branch filter: stacked PRs target feature branches and need checks too.
  pull_request:

jobs:
  verify:
    name: Lint, typecheck & test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  # The JS job never touches the native code; these two compile it against the
  # example app so a broken .m/.kt cannot ship.
  android:
    name: Compile Android module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Install example dependencies
        run: npm install
        working-directory: example
      - name: Compile library
        run: ./gradlew :react-native-app-inspector:compileDebugJavaWithJavac --no-daemon
        working-directory: example/android

  # The example pins one React Native version; the library supports a range.
  # These scaffold a throwaway app per version and compile the module against
  # it — the only place the legacy-architecture sources are still built, since
  # React Native 0.82+ forces the New Architecture on.
  compat:
    name: Compile against RN ${{ matrix.rn }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported; its template defaults to the legacy architecture.
          - rn: 0.74.5
            legacy: true
          - rn: 0.76.9
            legacy: true
          - rn: 0.81.4
            legacy: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Scaffold a bare app
        run: |
          npx --yes @react-native-community/cli@latest init CompatApp \
            --version ${{ matrix.rn }} --skip-install --skip-git-init \
            --install-pods false --directory "$RUNNER_TEMP/app"
      - name: Link the library from source
        run: |
          cat > "$RUNNER_TEMP/app/react-native.config.js" <<EOF
          module.exports = {
            dependencies: {
              'react-native-app-inspector': {root: '$GITHUB_WORKSPACE'},
            },
          };
          EOF
      - name: Install app dependencies
        run: npm install
        working-directory: ${{ runner.temp }}/app
      - name: Compile the module
        run: ./gradlew :react-native-app-inspector:compileDebugJavaWithJavac --no-daemon
        working-directory: ${{ runner.temp }}/app/android
      - name: Compile the module (legacy architecture)
        if: matrix.legacy
        run: |
          ./gradlew :react-native-app-inspector:compileDebugJavaWithJavac \
            -PnewArchEnabled=false --no-daemon
        working-directory: ${{ runner.temp }}/app/android

  ios:
    name: Compile iOS module
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install example dependencies
        run: npm install
        working-directory: example
      - name: Install pods
        run: bundle install && bundle exec pod install --project-directory=ios
        working-directory: example
        env:
          LANG: en_US.UTF-8
      - name: Build library pod
        run: |
          xcodebuild -workspace AppInspectorExample.xcworkspace \
            -scheme react-native-app-inspector \
            -sdk iphonesimulator -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -50
        working-directory: example/ios
